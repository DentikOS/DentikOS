# CI/CD Pipeline para Studio Dental
# Ejecuta lint + test + build + architecture en cada PR y push a main
# F3-01 y F3-02 del MASTER_ROADMAP.md
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones previas del mismo PR/branch si llega un nuevo commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar oxlint
        run: npm run lint

  test:
    name: 🧪 Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de tests
        run: npm run test


  security-regression:
    name: 🔒 Security Regression Suite (F7-24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Security Regression Suite
        run: npm run test:security

      - name: Verificar resultado (gate obligatorio)
        if: failure()
        run: |
          echo "❌ Security Regression Suite falló — PR bloqueado"
          echo "   Un PR no puede mergearse a main si falla aislamiento multi-tenant,"
          echo "   RBAC, logout/PHI, Storage o audit log (F7-24)."
          exit 1


  deno:
    name: 🦕 Deno (Edge Functions type-check + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check de Edge Functions
        run: cd supabase/functions && deno check **/*.ts

      - name: Ejecutar tests de Edge Functions
        run: cd supabase/functions && deno test -A .

      - name: Verificar resultado (gate obligatorio)
        if: failure()
        run: |
          echo "❌ Deno tests fallaron — PR bloqueado"
          echo "   Un PR no puede mergearse a main si las Edge Functions"
          echo "   no compilan o sus tests unitarios fallan."
          exit 1

  build:
    name: 🏗️ Build (Vite production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Verificar que se generó el bundle
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ El directorio dist/ no se generó"
            exit 1
          fi
          echo "✅ Bundle generado exitosamente"
          ls -lh dist/

  architecture:
    name: 🏛️ Arquitectura (Constitución)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar reglas arquitectónicas
        run: npm run validate:architecture

  coverage:
    name: 📊 Cobertura de Tests (F6-K)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con coverage
        run: npm run test:coverage

      - name: Subir reporte HTML de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Verificar umbrales de cobertura
        run: |
          echo "✅ Cobertura verificada contra umbrales configurados en vitest.config.js"
          echo "   - Statements: ≥20%"
          echo "   - Branches: ≥50%"
          echo "   - Functions: ≥30%"
          echo "   - Lines: ≥20%"

  e2e:
    name: Tests E2E (Playwright + Supabase staging)
    # F7-36 FASE 10: DESHABILITADO — Supabase staging eliminado
    # Razón: No hay entorno staging disponible para ejecutar E2E.
    # Ejecutar contra producción sería peligroso (modificaría datos reales).
    # Código preservado para cuando se cree nuevo entorno staging.
    # Ver documentación en docs/DEUDAS_TECNICAS.md
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # needs: [build]  # Comentado: job deshabilitado

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular versión de Playwright
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Caché de browsers de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Instalar browsers de Playwright (con deps del sistema)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar deps del sistema (si había cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Configurar .env de staging
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_USE_SUPABASE=true
          VITE_ENVIRONMENT=staging
          EOF
          echo "✅ .env configurado (valores ocultos)"

      - name: Ejecutar seed E2E en Supabase staging (no-crítico)
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  E2E_DATABASE_URL no configurado: saltando seed"
            echo "    Los tests pueden fallar si los usuarios e2e_* no existen"
            exit 0
          fi
          sudo apt-get install -y postgresql-client
          if psql "$DATABASE_URL" -f supabase/seed-multiclinica-e2e.sql; then
            echo "✅ Seed E2E aplicado exitosamente"
          else
            echo "⚠️  Seed E2E falló (posible problema de IPv6/red)"
            echo "    Continuando con los tests — los usuarios E2E pueden ya existir"
            echo "    Si los tests fallan por usuarios faltantes, aplicar seed manualmente:"
            echo "    https://github.com/miguelmcdr-boop/Studio-Dental/blob/main/supabase/seed-multiclinica-e2e.sql"
            exit 0
          fi

      - name: Ejecutar tests E2E
        env:
          CI: true
        run: npm run test:e2e

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Subir screenshots y videos de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            e2e/test-results/
          retention-days: 7
